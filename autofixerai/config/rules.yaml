- name: ResourceExhaustion
  pattern: "(Resource consumption|This pod will crash|Memory usage)"
  fix: "kubectl top pod {pod}"
  explanation: "Pod is crashing due to resource exhaustion; `kubectl top pod` shows its CPU/memory usage so you can adjust limits."
- name: BrokenImage
  pattern: "Error from server.*pull image|Failed to pull image"
  fix:    "kubectl delete pod {pod}"
  explanation: "Image pull failed; deleting pod forces a retry."
# at the bottom of config/rules.yaml
# Synthetic test to exercise the rule-based path
- name: SyntheticCrashTest
  pattern: "This pod will crash"
  fix:    "kubectl delete pod {pod}"
  explanation: "Synthetic rule: delete the pod to demonstrate automatic remediation."
- name: CustomImagePullError
  pattern: "waiting to start.*pull image"
  fix: "kubectl delete pod {pod}"
  explanation: "Pod could not pull its image; deleting will force a retry."

- name: CustomCrashSignal
  pattern: "This pod will crash|\\bcrashing\\b"
  fix: "kubectl delete pod {pod}"
  explanation: "Detected custom crash signal; recycling the pod may resolve transient faults."
- name: CustomWillCrash
  pattern: "This pod will crash"
  fix: "kubectl delete pod {pod}"
  explanation: "Test message indicates pod is un-healthy; deleting triggers a fresh instance."